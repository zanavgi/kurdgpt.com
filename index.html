<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rawand AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", "Noto Sans Arabic", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app-container {
            -webkit-overflow-scrolling: touch;
        }
        
        /* View & Navigation System */
        #app-content {
            position: relative;
        }
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            overflow-y: auto;
        }
        .app-view.active-view {
            display: block;
        }

        /* Slide Animations */
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .slide-in-right {
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        
        /* Tab Bar */
        .tab-button.active {
            color: var(--system-blue);
        }

        /* UI Components: Inset Grouped List */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }
        .list-item-chevron {
            color: var(--label-secondary);
            opacity: 0.5;
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-between p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
             <button id="back-button" class="text-[var(--system-blue)] opacity-0 transition-opacity pointer-events-none flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                <span id="back-button-label" class="text-base"></span>
            </button>
            <h1 id="header-title" class="text-lg font-semibold text-center absolute left-1/2 -translate-x-1/2">وانەکان</h1>
        </header>

        <main id="app-content" class="flex-1 overflow-y-auto relative">
            
            <div id="subjects-view" class="app-view active-view">
                <ul id="subjects-list" class="list-inset-grouped">
                    <!-- Subjects will be rendered here by JavaScript -->
                </ul>
            </div>

            <div id="subject-detail-view" class="app-view">
                <div class="p-4">
                    <h2 id="detail-title" class="text-2xl font-bold mb-4"></h2>
                    <p id="detail-intro" class="text-[var(--label-secondary)] mb-6"></p>
                    <button id="speak-button" class="w-full flex items-center justify-center gap-2 bg-[var(--system-blue)] text-white font-bold py-3 px-4 rounded-lg active:bg-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        <span>گوێ لە ڕوونکردنەوەکە بگرە</span>
                    </button>
                </div>
                <ul id="semester-list" class="list-inset-grouped">
                    <!-- Semesters will be rendered here -->
                </ul>
            </div>

            <div id="camera-view" class="app-view p-4 flex flex-col items-center justify-center text-center">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-[var(--label-secondary)] mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                 <h2 class="text-2xl font-bold">پشکنەری زیرەک</h2>
                 <p class="text-[var(--label-secondary)] mt-2 mb-6">کامێراکەت ئاراستەی لاپەڕەی کتێبەکەت بکە بۆ ئەوەی ڕوونکردنەوەی بۆ وەربگریت.</p>
                 <button class="w-full bg-[var(--system-blue)] text-white font-bold py-3 px-4 rounded-lg active:bg-blue-600 transition-colors">
                    دەستپێکردنی کامێرا
                 </button>
            </div>
            
            <div id="profile-view" class="app-view">
                 <ul class="list-inset-grouped">
                    <li>ناو: قوتابی پۆلی ٥</li>
                    <li>قوتابخانە: بنەڕەتی</li>
                 </ul>
                 <div class="text-center text-[var(--label-secondary)] text-sm p-4">
                     <p>ئەپی ڕەوەند ٢٠٢٥-٢٠٢٦</p>
                     <p>دروستکراوە لەلایەن زانا فاروق</p>
                 </div>
            </div>
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="subjects-view" data-title="وانەکان" class="tab-button active flex flex-col items-center p-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                <span class="text-xs mt-1">وانەکان</span>
            </button>
            <button data-view="camera-view" data-title="کامێرا" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                <span class="text-xs mt-1">کامێرا</span>
            </button>
            <button data-view="profile-view" data-title="پرۆفایل" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span class="text-xs mt-1">پرۆفایل</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DATA SOURCE ---
        const subjects = [
            { id: 'kurdish', name: 'کوردی', semesters: ['وەرزی یەکەم: ڕێزمان', 'وەرزی دووەم: هۆنراوە و خوێندنەوە'] },
            { id: 'arabic', name: 'عەرەبی', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
            { id: 'social', name: 'کۆمەڵایەتی', semesters: ['وەرزی یەکەم: مێژوو', 'وەرزی دووەم: جوگرافیا'] },
            { id: 'science', name: 'زانست', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
            { id: 'english', name: 'ئینگلیزی', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
            { id: 'religion', name: 'ئایین', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
            { id: 'art', name: 'هونەر', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
            { id: 'sports', name: 'وەرزش', semesters: ['وەرزی یەکەم', 'وەرزی دووەم'] },
        ];

        // --- DOM ELEMENTS ---
        const headerTitle = document.getElementById('header-title');
        const tabButtons = document.querySelectorAll('.tab-button');
        const backButton = document.getElementById('back-button');
        const backButtonLabel = document.getElementById('back-button-label');
        
        const subjectsListContainer = document.getElementById('subjects-list');
        const detailTitle = document.getElementById('detail-title');
        const detailIntro = document.getElementById('detail-intro');
        const semesterListContainer = document.getElementById('semester-list');
        const speakButton = document.getElementById('speak-button');
        
        // --- STATE MANAGEMENT ---
        let navigationStack = [{ viewId: 'subjects-view', title: 'وانەکان' }];

        // --- NAVIGATION SYSTEM ---
        function navigateTo(viewId, title, context = null) {
            const currentNavState = navigationStack[navigationStack.length - 1];
            const currentView = document.getElementById(currentNavState.viewId);
            const nextView = document.getElementById(viewId);

            if (!nextView || viewId === currentNavState.viewId) return;

            // Update header
            headerTitle.textContent = title;

            // Animate views
            currentView.classList.add('slide-out-left');
            nextView.classList.add('active-view', 'slide-in-right');
            
            setTimeout(() => {
                currentView.classList.remove('active-view', 'slide-out-left');
                nextView.classList.remove('slide-in-right');
            }, 350);

            // Update navigation stack for detail views
            navigationStack.push({ viewId, title, previousTitle: currentNavState.title });
            updateUIForNavigationState();

            // If it's a detail view, render its content
            if (context && context.subjectId) {
                renderSubjectDetail(context.subjectId);
            }
        }

        function navigateBack() {
            if (navigationStack.length <= 1) return;

            const currentNavState = navigationStack.pop();
            const previousNavState = navigationStack[navigationStack.length - 1];
            
            const currentView = document.getElementById(currentNavState.viewId);
            const previousView = document.getElementById(previousNavState.viewId);

            // Update header
            headerTitle.textContent = previousNavState.title;

            // Animate views
            previousView.classList.add('active-view'); // Make it visible before animation
            currentView.classList.add('slide-out-right'); // Custom animation needed
            previousView.classList.add('slide-in-left'); // Custom animation needed

            // This is a reverse animation, so we'll do it manually
            currentView.style.transform = 'translateX(100%)';
            previousView.style.transform = 'translateX(-100%)';
            requestAnimationFrame(() => {
                 previousView.style.transform = 'translateX(0)';
            });

            setTimeout(() => {
                currentView.classList.remove('active-view');
                currentView.style.transform = '';
                previousView.style.transform = '';
            }, 350);
            
            updateUIForNavigationState();
        }

        function updateUIForNavigationState() {
            const isAtRoot = navigationStack.length <= 1;
            if (isAtRoot) {
                backButton.classList.add('opacity-0', 'pointer-events-none');
            } else {
                const previousNavState = navigationStack[navigationStack.length - 2];
                backButtonLabel.textContent = previousNavState.title;
                backButton.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        // --- RENDER FUNCTIONS ---
        function renderSubjects() {
            subjectsListContainer.innerHTML = '';
            subjects.forEach(subject => {
                const li = document.createElement('li');
                li.className = 'cursor-pointer active:bg-gray-100';
                li.innerHTML = `
                    <span>${subject.name}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 list-item-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                `;
                li.addEventListener('click', () => navigateTo('subject-detail-view', subject.name, { subjectId: subject.id }));
                subjectsListContainer.appendChild(li);
            });
        }

        function renderSubjectDetail(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) return;

            detailTitle.textContent = subject.name;
            detailIntro.textContent = `لێرەدا دەتوانیت وانەکانی ${subject.name} بۆ هەردوو وەرزی ساڵ ببینیت.`;
            semesterListContainer.innerHTML = '';

            subject.semesters.forEach(semester => {
                const li = document.createElement('li');
                li.textContent = semester;
                semesterListContainer.appendChild(li);
            });
            
            // Update the speak button's functionality
            speakButton.onclick = () => speak(`سڵاو، بەخێربێیت بۆ وانەی ${subject.name}. ${detailIntro.textContent}`);
        }

        // --- AI & INTERACTIVITY ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ku-IQ'; // Attempt to use Kurdish voice
                utterance.rate = 0.9;
                speechSynthesis.cancel(); // Cancel any previous speech
                speechSynthesis.speak(utterance);
            } else {
                alert("داوای لێبوردن دەکەین، وێبگەڕەکەت پشتگیری دەنگ ناکات.");
            }
        }
        
        // --- INITIALIZATION & EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSubjects();

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const viewId = button.dataset.view;
                    const title = button.dataset.title;
                    if (viewId && title) {
                        // Reset navigation stack when switching tabs
                        navigationStack = [{ viewId: viewId, title: title }];
                        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
                        document.getElementById(viewId).classList.add('active-view');
                        
                        headerTitle.textContent = title;
                        updateUIForNavigationState();

                        // Update active tab button style
                        tabButtons.forEach(btn => btn.classList.remove('active', 'text-[var(--label-secondary)]'));
                        button.classList.add('active');
                        tabButtons.forEach(btn => {
                            if (!btn.classList.contains('active')) {
                                btn.classList.add('text-[var(--label-secondary)]');
                            }
                        });
                    }
                });
            });

            backButton.addEventListener('click', navigateBack);
        });

    </script>
</body>
</html>
