<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dana AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7;
            --system-gray-2: #ffffff;
            --system-gray-3: #c7c7cc;
            --system-gray-4: #e5e5ea; /* AI chat bubble */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #app-container {
            -webkit-overflow-scrolling: touch;
        }
        #app-content {
            position: relative;
        }
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            display: flex;
            flex-direction: column;
        }
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
            display: none;
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .slide-in-right { animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
        .slide-out-left { animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
        .tab-button.active { color: var(--system-blue); }
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
        }
        .list-inset-grouped li:last-child { border-bottom: none; }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-2)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">دانە</h1>
        </header>

        <main id="app-content" class="flex-1 overflow-y-auto relative">
            
            <div id="chat-view" class="app-view">
                <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be rendered here -->
                </div>
                <div id="typing-indicator" class="px-4 py-2 text-sm text-[var(--label-secondary)] hidden">
                    <span>دانە دەنووسێت...</span>
                </div>
                <form id="message-form" class="flex items-center p-2 border-t border-[var(--system-gray-3)] bg-[var(--system-gray-1)]">
                    <input id="message-input" type="text" placeholder="پرسیارێک بکە..." class="flex-1 bg-[var(--system-gray-2)] rounded-full px-4 py-2 border border-[var(--system-gray-3)] focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)]">
                    <button type="submit" class="ml-2 text-[var(--system-blue)] font-bold px-3">ناردن</button>
                </form>
            </div>

            <div id="about-view" class="app-view hidden p-0">
                 <ul class="list-inset-grouped">
                    <li class="flex justify-between items-center">
                        <span>ناو</span>
                        <span class="text-[var(--label-secondary)]">دانە</span>
                    </li>
                     <li class="flex justify-between items-center">
                        <span>وەشان</span>
                        <span class="text-[var(--label-secondary)]">1.1</span>
                    </li>
                 </ul>
                 <div class="px-4 text-center mt-4">
                    <p class="text-sm text-[var(--label-secondary)]">ئەم زیرەکییە دەستکردە کوردییە لەلایەن زانا فاروقەوە دروستکراوە بۆ وەڵامدانەوەی گشتی.</p>
                 </div>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-2)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="دانە" class="tab-button active flex flex-col items-center p-2 transition-colors">
                <svg xmlns="http://www.w.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">چات</span>
            </button>
            <button data-view="about-view" data-title="دەربارە" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-xs mt-1">دەربارە</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DOM Elements ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const headerTitle = document.getElementById('header-title');
        const messageContainer = document.getElementById('message-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const typingIndicator = document.getElementById('typing-indicator');

        // --- App State ---
        let currentViewId = 'chat-view';
        const conversation = [
            {
                sender: 'ai',
                text: 'سڵاو، من دانە، یاریدەدەری زیرەکی دەستکردی تۆم. چۆن دەتوانم یارمەتیت بدەم؟'
            }
        ];

        // --- Core Functions ---
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            if (headerTitle) {
                headerTitle.textContent = title;
            }

            if (currentView && nextView) {
                currentView.classList.add('slide-out-left');
                
                nextView.style.display = 'flex'; // Use flex for view layout
                nextView.classList.remove('hidden');
                nextView.classList.add('slide-in-right');

                setTimeout(() => {
                    currentView.style.display = 'none';
                    currentView.classList.add('hidden');
                    currentView.classList.remove('slide-out-left');
                    nextView.classList.remove('slide-in-right');
                }, 350);
            }
            
            currentViewId = viewId;

            tabButtons.forEach(button => {
                if (button.dataset.view === viewId) {
                    button.classList.add('active');
                    button.classList.remove('text-[var(--label-secondary)]');
                } else {
                    button.classList.remove('active');
                    button.classList.add('text-[var(--label-secondary)]');
                }
            });
        }
        
        function renderConversation() {
            messageContainer.innerHTML = '';
            conversation.forEach(msg => {
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const messageBubble = document.createElement('div');
                messageBubble.className = `max-w-[80%] rounded-2xl px-4 py-2 ${msg.sender === 'user' ? 'bg-[var(--system-blue)] text-white rounded-br-lg' : 'bg-[var(--system-gray-2)] text-black rounded-bl-lg'}`;
                messageBubble.textContent = msg.text;
                
                messageWrapper.appendChild(messageBubble);
                messageContainer.appendChild(messageWrapper);
            });
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function getAIResponse(userInput) {
            // Expanded keyword-based AI logic for general questions
            const lowerInput = userInput.toLowerCase();
            if (lowerInput.includes('سڵاو') || lowerInput.includes('چۆنی')) {
                return 'سڵاو! من باشم، سوپاس. تۆ چۆنی؟';
            } else if (lowerInput.includes('ناوت چیە') || lowerInput.includes('تۆ کێیت')) {
                return 'ناوی من دانەیە، یاریدەدەرێکی زیرەکی دەستکردم بۆ وەڵامدانەوەی پرسیارەکانت.';
            } else if (lowerInput.includes('کێ دروستی کردووی')) {
                return 'من لەلایەن زانا فاروقەوە دروستکراوم.';
            } else if (lowerInput.includes('پایتەختی کوردستان')) {
                 return 'پایتەختی هەرێمی کوردستان شاری هەولێرە.';
            } else if (lowerInput.includes('کەش و هەوا')) {
                return 'ببورە، من ناتوانم زانیاری ڕاستەوخۆی کەش و هەوا دابین بکەم چونکە پەیوەستم نییە بە ئینتەرنێتەوە.';
            } else if (lowerInput.includes('دوو کۆی دوو')) {
                return 'دوو کۆی دوو دەکاتە چوار (٤).';
            } else if (lowerInput.includes('شاری سلێمانی')) {
                return 'سلێمانی شارێکی گەورە و جوانە لە باشووری کوردستان و ناسراوە بە پایتەختی ڕۆشنبیری.';
            } else {
                return 'ببورە، لە پرسیارەکەت تێنەگەیشتم. دەتوانیت بە شێوازێکی تر پرسیار بکەیت؟';
            }
        }

        function handleSendMessage(event) {
            event.preventDefault();
            const userInput = messageInput.value.trim();
            if (userInput === '') return;

            // Add user message to state and render
            conversation.push({ sender: 'user', text: userInput });
            renderConversation();
            messageInput.value = '';

            // Simulate AI response
            typingIndicator.classList.remove('hidden');
            messageContainer.scrollTop = messageContainer.scrollHeight;

            setTimeout(() => {
                const aiResponse = getAIResponse(userInput);
                conversation.push({ sender: 'ai', text: aiResponse });
                typingIndicator.classList.add('hidden');
                renderConversation();
            }, 1200);
        }

        // --- Event Listeners ---
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const viewId = button.dataset.view;
                const title = button.dataset.title;
                if (viewId && title) {
                    navigateTo(viewId, title);
                }
            });
        });

        messageForm.addEventListener('submit', handleSendMessage);

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById(currentViewId).style.display = 'flex';
            document.getElementById(currentViewId).classList.remove('hidden');
            renderConversation();
        });
    </script>
</body>
</html>
