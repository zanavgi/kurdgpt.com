<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai KurdCPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI message bubble */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
            --label-tertiary: #c5c5c7;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app-container {
            -webkit-overflow-scrolling: touch;
        }

        #app-content {
            position: relative;
        }

        .app-view {
            display: none; /* Hidden by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
        }

        .app-view.active {
            display: flex; /* Active view is visible */
        }
        
        .app-view.hidden {
             display: none;
        }
        
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .slide-in-right {
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }

        .tab-button.active {
            color: var(--system-blue);
        }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }

        /* Chat Styles */
        #chat-messages::-webkit-scrollbar {
            display: none; /* Hide scrollbar for a cleaner look */
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">گفتوگۆی نوێ</h1>
        </header>

        <main id="app-content" class="flex-1 overflow-hidden relative">
            
            <!-- Chat View -->
            <div id="chat-view" class="app-view active flex-col">
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be rendered here by JavaScript -->
                </div>
                <div class="p-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)]">
                    <form id="chat-form" class="flex items-center space-x-2">
                        <input id="message-input" type="text" placeholder="نامەکەت بنووسە..." class="flex-1 w-full px-4 py-2 text-base bg-[var(--system-gray-2)] border border-[var(--system-gray-3)] rounded-full focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)]">
                        <button type="submit" class="w-8 h-8 flex items-center justify-center bg-[var(--system-blue)] text-white rounded-full flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.428A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="app-view hidden p-4">
                <ul class="list-inset-grouped">
                    <li><button class="w-full text-left">پڕۆفایل</button></li>
                    <li><button class="w-full text-left">ئاگادارکردنەوەکان</button></li>
                    <li><button class="w-full text-left">شێوازی دەرکەوتن</button></li>
                </ul>
                 <ul class="list-inset-grouped">
                    <li><button class="w-full text-left">دەربارە</button></li>
                    <li><button class="w-full text-left">یارمەتی</button></li>
                </ul>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="گفتوگۆی نوێ" class="tab-button active flex flex-col items-center p-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">گفتوگۆ</span>
            </button>
            <button data-view="settings-view" data-title="ڕێکخستنەکان" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs mt-1">ڕێکخستنەکان</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DOM Elements ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const headerTitle = document.getElementById('header-title');
        const chatMessagesContainer = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        // --- App State ---
        let currentViewId = 'chat-view';
        const messages = [
            {
                sender: 'ai',
                text: 'سڵاو! من Ai KurdCPTم، یاریدەدەری زیرەکی تۆ. لەلایەن ڕەوەند ئەی ئای دروستکراوم. چۆن دەتوانم یارمەتیت بدەم؟'
            }
        ];

        // --- Text-to-Speech ---
        function speakKurdish(text) {
            // The Web Speech API has limited support for Kurdish ('ku').
            // This function will attempt to use it, but may fall back to a browser default.
            // A fast speech rate is requested.
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ku-IQ'; // Attempt to use Kurdish (Iraq)
                utterance.rate = 1.3; // A bit faster than normal
                
                // Fallback voice selection if Kurdish is not available
                let voices = window.speechSynthesis.getVoices();
                let kurdishVoice = voices.find(voice => voice.lang === 'ku-IQ' || voice.lang === 'ku');
                if (!kurdishVoice) {
                   // A common fallback could be Arabic as it might be available on more systems
                   kurdishVoice = voices.find(voice => voice.lang.startsWith('ar-'));
                }
                utterance.voice = kurdishVoice;

                window.speechSynthesis.speak(utterance);
            } else {
                console.log('Text-to-speech not supported in this browser.');
            }
        }
        // Load voices initially (they load asynchronously)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }


        // --- UI Rendering ---
        function renderMessages() {
            chatMessagesContainer.innerHTML = '';
            messages.forEach(message => {
                const bubble = document.createElement('div');
                bubble.classList.add('max-w-xs', 'md:max-w-md', 'p-3', 'rounded-2xl', 'break-words');

                if (message.sender === 'user') {
                    bubble.classList.add('bg-[var(--system-blue)]', 'text-white', 'self-end', 'ml-auto');
                    bubble.textContent = message.text;
                } else {
                    bubble.classList.add('bg-[var(--system-gray-4)]', 'text-black', 'self-start', 'mr-auto');
                    bubble.textContent = message.text;
                }
                chatMessagesContainer.appendChild(bubble);
            });
            // Auto-scroll to the latest message
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }

        // --- AI Response Simulation ---
        function getAIResponse() {
            const responses = [
                "زۆر باشە، تێگەیشتم.",
                "ببوورە، من هێشتا لە قۆناغی فێرکردندام و ناتوانم وەڵامی ئاڵۆز بدەمەوە.",
                "دەتوانیت پرسیارێکی تر بکەیت؟",
                "سوپاس بۆ بەکارهێنانی Ai KurdCPT."
            ];
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];

            setTimeout(() => {
                const aiMessage = { sender: 'ai', text: randomResponse };
                messages.push(aiMessage);
                renderMessages();
                speakKurdish(aiMessage.text);
            }, 1000);
        }

        // --- Event Handlers ---
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = messageInput.value.trim();
            if (userInput) {
                messages.push({ sender: 'user', text: userInput });
                renderMessages();
                messageInput.value = '';
                getAIResponse();
            }
        });

        // --- Navigation System ---
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            headerTitle.textContent = title;

            if (currentView && nextView) {
                currentView.classList.add('slide-out-left');
                nextView.classList.remove('hidden');
                nextView.classList.add('active', 'slide-in-right');

                setTimeout(() => {
                    currentView.classList.remove('active', 'slide-out-left');
                    currentView.classList.add('hidden');
                    nextView.classList.remove('slide-in-right');
                }, 350);
            }
            
            currentViewId = viewId;

            tabButtons.forEach(button => {
                if (button.dataset.view === viewId) {
                    button.classList.add('active');
                    button.classList.remove('text-[var(--label-secondary)]');
                } else {
                    button.classList.remove('active');
                    button.classList.add('text-[var(--label-secondary)]');
                }
            });
        }

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const viewId = button.dataset.view;
                const title = button.dataset.title;
                if(viewId && title) {
                    navigateTo(viewId, title);
                }
            });
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMessages();
            // Speak the initial welcome message
            setTimeout(() => speakKurdish(messages[0].text), 500);
        });
    </script>
</body>
</html>
