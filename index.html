<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FLKRDSTUDIO AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI chat bubble background */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
            --label-tertiary: #c5c5c7;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #app-container {
            -webkit-overflow-scrolling: touch;
        }
        #app-content {
            position: relative;
        }
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            display: flex; /* Use flex for view layout */
            flex-direction: column;
        }
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
            visibility: hidden;
        }

        /* Slide Animations */
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .slide-in-right {
            visibility: visible;
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .tab-button.active {
            color: var(--system-blue);
        }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
            font-size: 1.05rem;
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">چات</h1>
        </header>

        <main id="app-content" class="flex-1 overflow-hidden relative">
            
            <div id="chat-view" class="app-view">
                <!-- Message Display Area -->
                <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be rendered here by JavaScript -->
                </div>
                <!-- Message Input Area -->
                <div class="p-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)]">
                    <form id="chat-form" class="flex items-center space-x-2">
                        <input type="text" id="message-input" placeholder="نامەیەک بنووسە..." class="flex-1 w-full bg-[var(--system-gray-2)] border border-[var(--system-gray-3)] rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)]">
                        <button type="submit" class="w-8 h-8 flex items-center justify-center bg-[var(--system-blue)] text-white rounded-full flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <div id="settings-view" class="app-view hidden">
                <ul class="list-inset-grouped mt-4">
                    <li>پڕۆفایل</li>
                    <li>ئاگادارکردنەوەکان</li>
                    <li>شێوازی دەرکەوتن</li>
                </ul>
                 <ul class="list-inset-grouped">
                    <li>دەربارە</li>
                    <li>یارمەتی</li>
                </ul>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-1 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="چات" class="tab-button active flex flex-col items-center p-2 transition-colors w-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">چات</span>
            </button>
            <button data-view="settings-view" data-title="ڕێکخستنەکان" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors w-20">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0 3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs mt-1">ڕێکخستنەکان</span>
            </button>
        </nav>
    </div>

    <script>
        // --- State and DOM Elements ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const headerTitle = document.getElementById('header-title');
        const messageContainer = document.getElementById('message-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        let currentViewId = 'chat-view';
        const messages = [];

        // --- Core Functions ---

        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ckb'; // IETF language tag for Central Kurdish (Sorani)
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support text-to-speech.');
            }
        }

        function renderMessages() {
            if (!messageContainer) return;
            messageContainer.innerHTML = '';
            messages.forEach(msg => {
                const isUser = msg.sender === 'user';
                
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `flex items-center gap-2 ${isUser ? 'justify-end' : 'justify-start'}`;

                const speakButton = document.createElement('button');
                speakButton.className = 'speak-button p-1 text-gray-400 hover:text-[var(--system-blue)] transition-colors flex-shrink-0';
                speakButton.setAttribute('data-text', msg.text);
                speakButton.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                `;
                
                const messageBubble = document.createElement('div');
                messageBubble.className = `max-w-xs md:max-w-md p-3 rounded-2xl`;
                messageBubble.textContent = msg.text;

                if (isUser) {
                    messageBubble.classList.add('bg-[var(--system-blue)]', 'text-white', 'order-2');
                    speakButton.classList.add('order-1');
                    messageWrapper.appendChild(speakButton);
                    messageWrapper.appendChild(messageBubble);
                } else {
                    messageBubble.classList.add('bg-[var(--system-gray-4)]', 'text-[var(--label-primary)]');
                    messageWrapper.appendChild(messageBubble);
                    messageWrapper.appendChild(speakButton);
                }
                
                messageContainer.appendChild(messageWrapper);
            });
            // Scroll to the latest message
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }
        
        function addMessage(sender, text) {
            messages.push({ sender, text });
            renderMessages();
        }

        function simulateAiResponse() {
            setTimeout(() => {
                const responses = [
                    "زۆر باشە، چۆن دەتوانم یارمەتیت بدەم؟",
                    "تێگەیشتم. هیچ شتێکی تر هەیە؟",
                    "ئەوە پرسیارێکی باشە. با بۆتی بگەڕێم.",
                    "بێگومان، دەتوانم لەوەدا یارمەتیت بدەم."
                ];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                addMessage('ai', randomResponse);
            }, 1000);
        }

        // --- Navigation Logic ---
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            if (headerTitle) {
                headerTitle.textContent = title;
            }

            if (currentView && nextView) {
                const isForward = (
