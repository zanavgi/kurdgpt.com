<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dana AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background / AI message */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI message bubble */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
            --label-tertiary: #c5c5c7;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app-container {
            -webkit-overflow-scrolling: touch;
        }

        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            display: flex;
            flex-direction: column;
        }
        
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
        }

        /* Slide Animations */
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .slide-in-right {
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }

        .tab-button.active svg {
            color: var(--system-blue);
        }
        .tab-button.active span {
            color: var(--system-blue);
        }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }

        /* Typing indicator */
        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 1px;
            background-color: #9E9EA1;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
            animation: 1s blink infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-2)]/80 backdrop-blur-xl border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">دانە</h1>
        </header>

        <main id="app-content" class="flex-1 relative overflow-hidden">
            
            <div id="chat-view" class="app-view">
                <!-- Chat messages will be rendered here -->
                <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Initial AI message -->
                    <div class="flex justify-start">
                        <div class="bg-[var(--system-gray-4)] text-black rounded-2xl px-4 py-2 max-w-xs">
                            سڵاو، من دانە-م. چۆن دەتوانم یارمەتیت بدەم؟
                        </div>
                    </div>
                </div>

                <!-- Typing indicator -->
                <div id="typing-indicator-container" class="hidden p-4">
                     <div class="flex justify-start">
                        <div class="bg-[var(--system-gray-4)] rounded-2xl px-4 py-3 max-w-xs">
                            <div class="typing-indicator">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Message input form -->
                <div class="flex-shrink-0 bg-[var(--system-gray-1)] border-t border-[var(--system-gray-3)]">
                    <form id="message-form" class="flex items-center p-3">
                        <input type="text" id="message-input" placeholder="...پرسیارێک بکە" class="flex-1 bg-[var(--system-gray-2)] border border-[var(--system-gray-3)] rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)]">
                        <button type="submit" class="ml-3 text-[var(--system-blue)] font-semibold">ناردن</button>
                    </form>
                </div>
            </div>

            <div id="settings-view" class="app-view hidden !block p-0">
                <ul class="list-inset-grouped mt-4">
                    <li>پڕۆفایل</li>
                    <li>ئاگادارکردنەوەکان</li>
                    <li>شێوازی پیشاندان</li>
                </ul>
                 <ul class="list-inset-grouped">
                    <li>دەربارە</li>
                    <li>یارمەتی</li>
                </ul>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-2)]/80 backdrop-blur-xl border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="دانە" class="tab-button active flex flex-col items-center p-2 transition-colors">
                <svg xmlns="http://www.w.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">چات</span>
            </button>
            <button data-view="settings-view" data-title="ڕێکخستنەکان" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs mt-1">ڕێکخستنەکان</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DOM Elements ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const headerTitle = document.getElementById('header-title');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messageContainer = document.getElementById('message-container');
        const typingIndicator = document.getElementById('typing-indicator-container');
        let currentViewId = 'chat-view';

        // --- Data State ---
        const messages = [{
            sender: 'ai',
            text: 'سڵاو، من دانە-م. چۆن دەتوانم یارمەتیت بدەم؟'
        }];

        // --- Core Functions ---
        
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            if (headerTitle) {
                headerTitle.textContent = title;
            }

            if (currentView && nextView) {
                currentView.classList.add('slide-out-left');
                nextView.classList.remove('hidden');
                nextView.classList.add('slide-in-right');

                setTimeout(() => {
                    currentView.classList.add('hidden');
                    currentView.classList.remove('slide-out-left');
                    nextView.classList.remove('slide-in-right');
                }, 350);
            }
            
            currentViewId = viewId;

            tabButtons.forEach(button => {
                if (button.dataset.view === viewId) {
                    button.classList.add('active');
                    button.classList.remove('text-[var(--label-secondary)]');
                } else {
                    button.classList.remove('active');
                    button.classList.add('text-[var(--label-secondary)]');
                }
            });
        }

        function renderMessages() {
            messageContainer.innerHTML = '';
            messages.slice(1).forEach(message => { // slice(1) to skip initial welcome message hardcoded in HTML
                const messageWrapper = document.createElement('div');
                messageWrapper.classList.add('flex');
                
                const messageBubble = document.createElement('div');
                messageBubble.classList.add('rounded-2xl', 'px-4', 'py-2', 'max-w-xs');
                messageBubble.textContent = message.text;

                if (message.sender === 'user') {
                    messageWrapper.classList.add('justify-end');
                    messageBubble.classList.add('bg-[var(--system-blue)]', 'text-white');
                } else {
                    messageWrapper.classList.add('justify-start');
                    messageBubble.classList.add('bg-[var(--system-gray-4)]', 'text-black');
                }

                messageWrapper.appendChild(messageBubble);
                messageContainer.appendChild(messageWrapper);
            });
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function getAIResponse(userInput) {
            const lowerCaseInput = userInput.toLowerCase();
            // Specific response based on user prompt
            if (lowerCaseInput.includes('دێمە قەم') || lowerCaseInput.includes('دێمە لات')) {
                return 'فەرموو، من لێرەم بۆ یارمەتیدانت. پرسیارەکەت چییە؟';
            }
            // General responses
            switch (true) {
                case lowerCaseInput.includes('سڵاو') || lowerCaseInput.includes('چۆنی'):
                    return 'سڵاو! من زۆر باشم، سوپاس. ئامادەم بۆ وەڵامدانەوەی پرسیارەکانت.';
                case lowerCaseInput.includes('ناوت چییە'):
                    return 'ناوی من دانە-یە.';
                case lowerCaseInput.includes('کێ دروستی کردووی'):
                    return 'من لەلایەن گوڵەوە دروستکراوم، وەک زیرەکییەکی دەستکردی کوردی.';
                default:
                    return 'ببورە، لە ئێستادا وەڵامی ئەو پرسیارەم لا نییە. هەوڵدەدەم لە داهاتوودا فێری بم.';
            }
        }

        // --- Event Listeners ---
        
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const viewId = button.dataset.view;
                const title = button.dataset.title;
                if(viewId && title) {
                    navigateTo(viewId, title);
                }
            });
        });

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = messageInput.value.trim();
            if (userInput === '') return;

            // 1. Update state with user message
            messages.push({ sender: 'user', text: userInput });
            renderMessages();
            messageInput.value = '';

            // 2. Show typing indicator and simulate AI response
            typingIndicator.classList.remove('hidden');
            messageContainer.scrollTop = messageContainer.scrollHeight;

            setTimeout(() => {
                const aiResponse = getAIResponse(userInput);
                
                // 3. Update state with AI message
                messages.push({ sender: 'ai', text: aiResponse });
                typingIndicator.classList.add('hidden');
                renderMessages();
            }, 1500);
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            // The initial message is already in the HTML, so no initial render is needed.
            // But we ensure the view is correct.
            navigateTo('chat-view', 'دانە');
        });

    </script>
</body>
</html>
