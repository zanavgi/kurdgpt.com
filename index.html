<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zana AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-green: #34c759;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI chat bubble background */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        #app-content {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            display: flex; /* Make views flex containers */
            flex-direction: column; /* Stack children vertically */
        }
        
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
            display: none;
        }

        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .slide-in-right {
            display: flex !important;
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }

        .tab-button.active {
            color: var(--system-blue);
        }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }
        
        /* iOS Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 51px;
            height: 31px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--system-gray-3);
            transition: .4s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 27px;
            width: 27px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: var(--system-green);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        /* Chat Styles */
        .chat-bubble {
            max-width: 75%;
            padding: 0.6rem 0.9rem;
            border-radius: 1.25rem;
            word-wrap: break-word;
        }
        .chat-bubble-user {
            background-color: var(--system-blue);
            color: white;
            border-bottom-right-radius: 0.5rem;
        }
        .chat-bubble-ai {
            background-color: var(--system-gray-4);
            color: var(--label-primary);
            border-bottom-left-radius: 0.5rem;
        }
        .chat-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            outline: none;
            resize: none;
        }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">گفتوگۆی نوێ</h1>
        </header>

        <main id="app-content">
            
            <!-- Chat View -->
            <div id="chat-view" class="app-view">
                <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be rendered here by JavaScript -->
                </div>

                <!-- Message Input Form -->
                <div id="chat-input-container" class="p-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)]">
                    <form id="message-form" class="flex items-center space-x-2">
                        <input id="message-input" type="text" placeholder="پرسیارێک بکە..." class="chat-input flex-1 p-2.5 bg-[var(--system-gray-2)] rounded-full focus:outline-none px-4 text-base">
                        <button type="button" id="mic-button" class="p-2 text-[var(--label-secondary)] hover:text-[var(--system-blue)] transition-colors">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                        </button>
                        <button type="submit" class="p-2 text-[var(--system-blue)]">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" /></svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Settings View -->
            <div id="settings-view" class="app-view hidden">
                <div class="p-4 pt-6">
                    <ul class="list-inset-grouped">
                        <li>
                            <span>قسەکردن چالاک بکە</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="tts-toggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </li>
                        <li><span>زمان</span> <span class="text-[var(--label-secondary)]">کوردی (سۆرانی)</span></li>
                    </ul>
                     <ul class="list-inset-grouped">
                        <li><span>دەربارەی Zana AI</span></li>
                    </ul>
                </div>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="گفتوگۆی نوێ" class="tab-button active flex flex-col items-center p-2 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">گفتوگۆ</span>
            </button>
            <button data-view="settings-view" data-title="ڕێکخستنەکان" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs mt-1">ڕێکخستنەکان</span>
            </button>
        </nav>
    </div>

    <script>
        const tabButtons = document.querySelectorAll('.tab-button');
        const headerTitle = document.getElementById('header-title');
        let currentViewId = 'chat-view';
        
        // --- DATA & STATE ---
        const messages = [
            {
                sender: 'ai',
                text: 'سڵاو! من زانام. چۆن دەتوانم یارمەتیت بدەم؟'
            }
        ];
        let isTtsEnabled = false;
        let kurdishVoice = null;

        // --- DOM ELEMENTS ---
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messageContainer = document.getElementById('message-container');
        const micButton = document.getElementById('mic-button');
        const ttsToggle = document.getElementById('tts-toggle');

        // --- TTS (TEXT-TO-SPEECH) LOGIC ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // BCP 47 language tag for Central Kurdish is 'ckb'
            // We search for 'ku' for broader compatibility
            kurdishVoice = voices.find(voice => voice.lang.startsWith('ku') || voice.lang === 'ckb-IQ');
            if (!kurdishVoice) {
                console.warn("Kurdish voice not found. TTS might not work as expected.");
            }
        }
        
        // The voices are loaded asynchronously.
        window.speechSynthesis.onvoiceschanged = loadVoices;
        
        function speak(text) {
            if (!isTtsEnabled || !text) return;
            
            window.speechSynthesis.cancel(); // Stop any currently playing speech
            
            const utterance = new SpeechSynthesisUtterance(text); // Create a new speech request.
            if (kurdishVoice) {
                utterance.voice = kurdishVoice;
                utterance.lang = kurdishVoice.lang; // Ensure correct language is set.
            } else {
                utterance.lang = 'ku-CKB'; // Fallback language code
            }
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            
            window.speechSynthesis.speak(utterance);
        }

        // --- RENDER FUNCTION ---
        function renderMessages() {
            messageContainer.innerHTML = ''; // Clear existing messages
            messages.forEach(msg => {
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `w-full flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`;

                const messageBubble = document.createElement('div');
                messageBubble.className = `chat-bubble ${msg.sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-ai'}`;
                messageBubble.textContent = msg.text;

                messageWrapper.appendChild(messageBubble);
                messageContainer.appendChild(messageWrapper);
            });
            // Scroll to the latest message
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // --- EVENT LISTENERS ---
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = messageInput.value.trim();
            if (userInput === '') return;

            messages.push({ sender: 'user', text: userInput });
            renderMessages();
            messageInput.value = '';
            simulateAIResponse(userInput);
        });
        
        micButton.addEventListener('click', () => {
            alert('Speech-to-text is not yet implemented.');
        });
        
        ttsToggle.addEventListener('change', (e) => {
            isTtsEnabled = e.target.checked;
            if (isTtsEnabled && !kurdishVoice) {
                 alert('ببورە، دەنگی کوردی لەسەر ئامێرەکەت بەردەست نییە. ڕەنگە پێویست بکات لە ڕێکخستنەکانی ئامێرەکەت زیادی بکەیت.');
            }
            if (!isTtsEnabled) {
                window.speechSynthesis.cancel(); // Stop speaking if disabled
            }
        });
        
        function simulateAIResponse(userInput) {
            setTimeout(() => {
                let aiResponse = "ببورە، وەک مۆدێلێکی زمانەوانی، ناتوانم وەڵامی ئەو پرسیارە بدەمەوە.";

                if(userInput.includes("سڵاو") || userInput.includes("چۆنی")){
                    aiResponse = "سڵاو! من باشم، سوپاس. تۆ چۆنی؟";
                } else if(userInput.includes("ناوت چییە")){
                    aiResponse = "ناوی من زانایە، زیرەکییەکی دەستکردم.";
                } else {
                     aiResponse = "پرسیارێکی سەرنجڕاکێشە. با زیاتر لێی بکۆڵینەوە.";
                }

                messages.push({ sender: 'ai', text: aiResponse });
                renderMessages();
                speak(aiResponse);

            }, 1000); // Simulate network delay
        }

        // --- NAVIGATION LOGIC ---
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);
            headerTitle.textContent = title;

            currentView.classList.add('slide-out-left');
            
            setTimeout(() => {
                currentView.classList.add('hidden');
                currentView.classList.remove('slide-out-left');
                nextView.classList.remove('hidden');
                nextView.classList.add('slide-in-right');
            }, 50); 
            
            setTimeout(() => {
                nextView.classList.remove('slide-in-right');
            }, 400); 
            
            currentViewId = viewId;

            tabButtons.forEach(button => {
                const isActive = button.dataset.view === viewId;
                button.classList.toggle('active', isActive);
                button.classList.toggle('text-[var(--label-secondary)]', !isActive);
            });
        }

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                navigateTo(button.dataset.view, button.dataset.title);
            });
        });

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
             renderMessages();
             loadVoices();
             document.getElementById('chat-view').classList.remove('hidden');
             document.getElementById('settings-view').classList.add('hidden');
             speak(messages.find(m => m.sender === 'ai')?.text);
        });

    </script>
</body>
</html>
