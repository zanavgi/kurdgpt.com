<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bunuusi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI message background */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #app-container {
            -webkit-overflow-scrolling: touch;
        }
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            opacity: 1;
        }
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
            opacity: 0;
        }
        @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slide-out-left { from { transform: translateX(0); } to { transform: translateX(-100%); } }
        .slide-in-right { animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
        .slide-out-left { animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
        .tab-button.active { color: var(--system-blue); }
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
            font-size: 1.05rem;
        }
        .list-inset-grouped li:last-child { border-bottom: none; }
        #chat-messages::-webkit-scrollbar { display: none; }
        #chat-messages { scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">چات</h1>
        </header>

        <main id="app-content" class="flex-1 relative">
            
            <!-- Chat View -->
            <div id="chat-view" class="app-view flex flex-col h-full">
                <div id="chat-messages" class="flex-1 p-4 space-y-4 overflow-y-auto">
                    <!-- Messages will be rendered here by JavaScript -->
                </div>
                <div id="chat-input-container" class="flex-shrink-0 p-2 bg-[var(--system-gray-1)] border-t border-[var(--system-gray-3)]">
                    <form id="chat-form" class="flex items-center space-x-2">
                        <input type="text" id="message-input" placeholder="...پرسیارێک بکە" class="w-full px-4 py-2 text-base border border-[var(--system-gray-3)] rounded-full focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)] transition-shadow" autocomplete="off">
                        <button type="submit" class="p-2 rounded-full bg-[var(--system-blue)] text-white flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-90" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- About View -->
            <div id="about-view" class="app-view hidden pt-4">
                <ul class="list-inset-grouped">
                    <li class="flex justify-between items-center">
                        <span>وەشان</span>
                        <span class="text-[var(--label-secondary)]">1.0.0</span>
                    </li>
                    <li class="flex justify-between items-center">
                        <span> گەشەپێدەر</span>
                        <span class="text-[var(--label-secondary)]">Zana Faruq</span>
                    </li>
                </ul>
                 <p class="text-center text-xs text-[var(--label-secondary)] mt-4 px-4">
                    ئەمە یاریدەدەرێکی زیرەکی دەستکردی کوردییە کە بۆ وەڵامدانەوەی پرسیارە گشتییەکانت دروستکراوە.
                </p>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-1 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="چات" class="tab-button active flex flex-col items-center p-2 transition-colors w-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="text-xs mt-1">چات</span>
            </button>
            <button data-view="about-view" data-title="دەربارە" class="tab-button text-[var(--label-secondary)] flex flex-col items-center p-2 transition-colors w-full">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span class="text-xs mt-1">دەربارە</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DOM Elements ---
        const headerTitle = document.getElementById('header-title');
        const tabButtons = document.querySelectorAll('.tab-button');
        const chatMessagesContainer = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        // --- App State ---
        let currentViewId = 'chat-view';
        const messages = [
            { sender: 'ai', text: 'سڵاو، من بونووسیم، یاریدەدەری زیرەکی تۆ. چۆن دەتوانم یارمەتیت بدەم؟' }
        ];
        
        // --- Core Functions ---
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            if (headerTitle) headerTitle.textContent = title;

            if (currentView && nextView) {
                currentView.classList.add('slide-out-left');
                nextView.classList.remove('hidden');
                nextView.classList.add('slide-in-right');

                setTimeout(() => {
                    currentView.classList.add('hidden');
                    currentView.classList.remove('slide-out-left');
                    nextView.classList.remove('slide-in-right');
                }, 350);
            }
            
            currentViewId = viewId;

            // Update active tab button style
            tabButtons.forEach(button => {
                const isActive = button.dataset.view === viewId;
                button.classList.toggle('active', isActive);
                button.classList.toggle('text-[var(--label-secondary)]', !isActive);
            });
        }

        function renderMessages() {
            chatMessagesContainer.innerHTML = '';
            messages.forEach(msg => {
                const messageBubble = document.createElement('div');
                messageBubble.classList.add('max-w-[80%]', 'p-3', 'rounded-2xl', 'break-words');

                if (msg.sender === 'user') {
                    messageBubble.classList.add('bg-[var(--system-blue)]', 'text-white', 'self-end', 'ml-auto');
                    messageBubble.style.textAlign = 'right';
                } else {
                    messageBubble.classList.add('bg-[var(--system-gray-4)]', 'text-[var(--label-primary)]', 'self-start', 'mr-auto');
                     messageBubble.style.textAlign = 'right';
                }
                messageBubble.textContent = msg.text;
                chatMessagesContainer.appendChild(messageBubble);
            });
            // Auto-scroll to the latest message
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }

        function simulateAiResponse() {
            // Add typing indicator
            const typingIndicator = document.createElement('div');
            typingIndicator.id = 'typing-indicator';
            typingIndicator.classList.add('max-w-[80%]', 'p-3', 'rounded-2xl', 'bg-[var(--system-gray-4)]', 'self-start', 'mr-auto');
            typingIndicator.innerHTML = '<div class="flex items-center space-x-1"><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div><div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce"></div></div>';
            chatMessagesContainer.appendChild(typingIndicator);
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;

            // Simulate network delay and response
            setTimeout(() => {
                const aiResponse = { 
                    sender: 'ai', 
                    text: 'ببوورە، وەک مۆدێلێکی زمان، لە ئێستادا ناتوانم وەڵامی ئەو جۆرە داواکارییانە بدەمەوە. تکایە پرسیارێکی تر بکە.' 
                };
                messages.push(aiResponse);
                // Remove typing indicator before re-rendering
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
                renderMessages();
            }, 1500);
        }

        // --- Event Listeners ---
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const viewId = button.dataset.view;
                const title = button.dataset.title;
                if(viewId && title) {
                    navigateTo(viewId, title);
                }
            });
        });

        chatForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const userText = messageInput.value.trim();

            if (userText) {
                // 1. Update state
                messages.push({ sender: 'user', text: userText });
                
                // 2. Re-render UI
                renderMessages();
                
                // 3. Clear input
                messageInput.value = '';

                // 4. Simulate AI response
                simulateAiResponse();
            }
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMessages();
        });
    </script>
</body>
</html>
