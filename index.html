<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FLKRDSTUDIO AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* AI chat bubble */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #app-container {
            -webkit-overflow-scrolling: touch;
        }
        #app-content {
            position: relative;
        }
        .app-view {
            display: none; /* Hidden by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
            flex-direction: column;
        }
        .app-view.active {
            display: flex; /* Active view is visible */
        }

        /* Slide Animations */
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .slide-in-right { animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
        .slide-out-left { animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }

        .tab-button.active { color: var(--system-blue); }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
            font-size: 1.05rem;
        }
        .list-inset-grouped li:last-child { border-bottom: none; }
        
        /* Custom scrollbar for chat */
        #chat-messages::-webkit-scrollbar { display: none; }
        #chat-messages { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center items-center bg-black">

    <div id="app-container" class="w-full max-w-md h-full flex flex-col bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">پرسیار</h1>
        </header>

        <main id="app-content" class="flex-1 overflow-hidden relative">
            
            <!-- Chat View -->
            <div id="chat-view" class="app-view active">
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be dynamically inserted here -->
                </div>
                <div id="typing-indicator" class="hidden p-4 flex items-center space-x-2">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0s;"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
                </div>
                <div class="p-2 border-t border-[var(--system-gray-3)] bg-[var(--system-gray-1)]">
                    <form id="message-form" class="flex items-center space-x-2">
                        <input id="message-input" type="text" placeholder="پرسیارەکەت بنووسە..." class="flex-1 p-2.5 bg-[var(--system-gray-2)] border border-[var(--system-gray-3)] rounded-2xl focus:outline-none focus:ring-2 focus:ring-[var(--system-blue)] text-base" autocomplete="off">
                        <button type="submit" class="p-2 text-[var(--system-blue)] font-semibold">ناردن</button>
                    </form>
                </div>
            </div>

            <!-- History View -->
            <div id="history-view" class="app-view overflow-y-auto">
                 <div id="history-list-container">
                    <!-- History list will be rendered here -->
                 </div>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-2 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="پرسیار" class="tab-button active flex flex-col items-center p-2 transition-colors w-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                <span class="text-xs mt-1">پرسیار</span>
            </button>
            <button data-view="history-view" data-title="مێژوو" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors w-20">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span class="text-xs mt-1">مێژوو</span>
            </button>
        </nav>
    </div>

    <script>
        // --- DOM Elements ---
        const headerTitle = document.getElementById('header-title');
        const tabButtons = document.querySelectorAll('.tab-button');
        const views = document.querySelectorAll('.app-view');
        const chatMessagesContainer = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const historyListContainer = document.getElementById('history-list-container');

        // --- App State ---
        let currentViewId = 'chat-view';
        const conversationHistory = [];

        // --- Core Functions ---

        /**
         * Handles navigation between views with animations.
         * @param {string} viewId - The ID of the view to navigate to.
         * @param {string} title - The title to display in the header.
         */
        function navigateTo(viewId, title) {
            if (viewId === currentViewId) return;

            const currentView = document.getElementById(currentViewId);
            const nextView = document.getElementById(viewId);

            headerTitle.textContent = title;

            if (currentView && nextView) {
                // Determine animation direction (basic implementation)
                const currentIndex = Array.from(tabButtons).findIndex(btn => btn.dataset.view === currentViewId);
                const nextIndex = Array.from(tabButtons).findIndex(btn => btn.dataset.view === viewId);

                // Simple slide left/right animation logic
                currentView.classList.add('slide-out-left');
                nextView.classList.remove('slide-in-right'); // Clear previous animation classes
                nextView.style.animation = ''; // Reset animation property
                
                nextView.classList.add('active');
                nextView.classList.add('slide-in-right');

                setTimeout(() => {
                    currentView.classList.remove('active');
                    currentView.classList.remove('slide-out-left');
                    nextView.classList.remove('slide-in-right');
                }, 350);
            }
            
            currentViewId = viewId;

            // Update active tab button
            tabButtons.forEach(button => {
                if (button.dataset.view === viewId) {
                    button.classList.add('active');
                    button.classList.remove('text-[var(--label-secondary)]');
                } else {
                    button.classList.remove('active');
                    button.classList.add('text-[var(--label-secondary)]');
                }
            });

            // Render content for the new view
            if (viewId === 'history-view') {
                renderHistory();
            }
        }

        /**
         * Renders the entire chat history in the chat view.
         */
        function renderChat() {
            chatMessagesContainer.innerHTML = ''; // Clear existing messages
            conversationHistory.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.textContent = msg.text;
                
                if (msg.sender === 'user') {
                    bubble.className = 'bg-[var(--system-blue)] text-white p-3 rounded-2xl max-w-[80%] self-end clear-both';
                } else {
                    bubble.className = 'bg-[var(--system-gray-4)] p-3 rounded-2xl max-w-[80%] self-start clear-both';
                }
                chatMessagesContainer.appendChild(bubble);
            });
            // Scroll to the bottom
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }
        
        /**
         * Renders the question history in the history view.
         */
        function renderHistory() {
            historyListContainer.innerHTML = ''; // Clear previous list
            const userQuestions = conversationHistory.filter(msg => msg.sender === 'user');

            if (userQuestions.length === 0) {
                historyListContainer.innerHTML = `<p class="text-[var(--label-secondary)] text-center p-8">هیچ پرسیارێک نەکراوە.</p>`;
                return;
            }

            const list = document.createElement('ul');
            list.className = 'list-inset-grouped';
            
            userQuestions.forEach(msg => {
                const listItem = document.createElement('li');
                listItem.textContent = msg.text;
                list.appendChild(listItem);
            });

            historyListContainer.appendChild(list);
        }

        /**
         * Simulates an AI response.
         * @param {string} userQuestion - The question from the user.
         */
        function simulateAIResponse(userQuestion) {
            typingIndicator.classList.remove('hidden');
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;

            setTimeout(() => {
                typingIndicator.classList.add('hidden');
                
                // This is a placeholder for a real AI response
                const aiResponseText = `زۆر سوپاس بۆ پرسیارەکەت. من مۆدێلێکی زیرەکی دەستکردم و هێشتا لە قۆناغی فێربووندام، بەڵام هەوڵ دەدەم باشترین وەڵامت بدەمەوە.`;
                
                conversationHistory.push({ sender: 'ai', text: aiResponseText });
                renderChat();
            }, 1500); // Simulate network delay
        }

        // --- Event Listeners ---
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const viewId = button.dataset.view;
                const title = button.dataset.title;
                if (viewId && title) {
                    navigateTo(viewId, title);
                }
            });
        });

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userInput = messageInput.value.trim();
            if (userInput) {
                // 1. Add user message to history
                conversationHistory.push({ sender: 'user', text: userInput });
                // 2. Re-render the chat UI
                renderChat();
                // 3. Clear the input field
                messageInput.value = '';
                // 4. Simulate AI response
                simulateAIResponse(userInput);
            }
        });

        // --- Initial Load ---
        function initializeApp() {
            conversationHistory.push({
                sender: 'ai',
                text: 'سڵاو، من زیرەکی دەستکردی کوردم. چۆن دەتوانم یارمەتیت بدەم؟'
            });
            renderChat();
        }

        initializeApp();
    </script>
</body>
</html>
