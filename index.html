<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <title>Ai KurdCPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-1: #f2f2f7; /* Primary background */
            --system-gray-2: #ffffff; /* Grouped component background */
            --system-gray-3: #c7c7cc; /* Borders, separators */
            --system-gray-4: #e5e5ea; /* Chat bubble background */
            --label-primary: #000000;
            --label-secondary: #8e8e93;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-1);
            color: var(--label-primary);
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        #app-content {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        
        .app-view.hidden {
            transform: translateX(100%);
            pointer-events: none;
            display: none;
        }

        /* Slide Animations */
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .slide-in-right {
            display: flex;
            animation: slide-in-right 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }
        .slide-out-left {
            animation: slide-out-left 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
        }

        .tab-button.active svg {
            color: var(--system-blue);
        }
        .tab-button.active span {
            color: var(--system-blue);
        }

        /* Inset Grouped List Style */
        .list-inset-grouped {
            margin: 1rem;
            border-radius: 0.75rem;
            background-color: var(--system-gray-2);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .list-inset-grouped li {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--system-gray-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-inset-grouped li:last-child {
            border-bottom: none;
        }
        .list-inset-grouped .chevron {
             color: var(--label-secondary);
             opacity: 0.5;
        }

        /* Chat Styles */
        #chat-messages {
            -webkit-overflow-scrolling: touch;
        }
        .chat-bubble {
            max-width: 75%;
            padding: 0.625rem 0.875rem;
            border-radius: 1.25rem;
            word-wrap: break-word;
        }
        .chat-bubble-ai {
            background-color: var(--system-gray-4);
            border-bottom-left-radius: 0.25rem;
        }
        .chat-bubble-user {
            background-color: var(--system-blue);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }
        #message-input-form input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-black flex justify-center items-center">

    <div id="app-container" class="w-full max-w-md h-full bg-[var(--system-gray-1)] shadow-2xl overflow-hidden">
        
        <header id="app-header" class="flex items-center justify-center p-3 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-b border-[var(--system-gray-3)] flex-shrink-0 z-10">
            <h1 id="header-title" class="text-lg font-semibold text-center mx-auto">گفتوگۆی نوێ</h1>
        </header>

        <main id="app-content">
            
            <div id="chat-view" class="app-view">
                <div id="chat-messages" class="flex-1 p-4 space-y-4 overflow-y-auto">
                    <!-- Chat messages will be rendered here by JavaScript -->
                </div>

                <div class="flex-shrink-0 p-2 bg-[var(--system-gray-1)] border-t border-[var(--system-gray-3)]">
                    <form id="message-input-form" class="flex items-center space-x-2">
                        <input type="text" id="message-input" placeholder="...پرسیارێک بکە" class="flex-1 w-full px-4 py-2 text-base bg-[var(--system-gray-2)] rounded-full border border-[var(--system-gray-3)] focus:ring-2 focus:ring-[var(--system-blue)]">
                        <button type="submit" class="w-9 h-9 flex items-center justify-center bg-[var(--system-blue)] text-white rounded-full flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <div id="settings-view" class="app-view hidden">
                <div>
                    <p class="text-[var(--label-secondary)] uppercase text-xs px-5 pt-6 pb-1 font-semibold">زانیاری</p>
                    <ul class="list-inset-grouped">
                        <li><span>دەربارەی Ai KurdCPT</span><span class="chevron">&rsaquo;</span></li>
                        <li><span>دروستکراوە لەلایەن ڕەوەند ئەی ئای</span><span class="chevron">&rsaquo;</span></li>
                    </ul>
                    <p class="text-[var(--label-secondary)] uppercase text-xs px-5 pt-6 pb-1 font-semibold">گشتی</p>
                    <ul class="list-inset-grouped">
                        <li><span>زمان</span><span>کوردی (سۆرانی)</span></li>
                        <li><span>یارمەتی</span><span class="chevron">&rsaquo;</span></li>
                    </ul>
                </div>
            </div>
            
        </main>

        <nav id="app-tab-bar" class="flex justify-around items-center py-1 bg-[var(--system-gray-1)]/80 backdrop-blur-md border-t border-[var(--system-gray-3)] flex-shrink-0">
             <button data-view="chat-view" data-title="Ai KurdCPT" class="tab-button active flex flex-col items-center p-2 transition-colors w-1/2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span class="text-xs mt-1">گفتوگۆ</span>
            </button>
            <button data-view="settings-view" data-title="ڕێکخستنەکان" class="tab-button flex flex-col items-center text-[var(--label-secondary)] p-2 transition-colors w-1/2">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs mt-1">ڕێکخستنەکان</span>
            </button>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-button');
            const headerTitle = document.getElementById('header-title');
            const messageForm = document.getElementById('message-input-form');
            const messageInput = document.getElementById('message-input');
            const chatMessagesContainer = document.getElementById('chat-messages');
            let currentViewId = 'chat-view';

            // --- Data Source ---
            const messages = [
                {
                    sender: 'ai',
                    text: 'سڵاو! من Ai KurdCPTم، لەلایەن ڕەوەند ئەی ئای دروستکراوم. چۆن دەتوانم یارمەتیت بدەم لە هەموو پرسیارێک؟'
                }
            ];

            // --- Render Function ---
            function renderMessages() {
                chatMessagesContainer.innerHTML = '';
                messages.forEach(msg => {
                    const messageWrapper = document.createElement('div');
                    messageWrapper.className = `flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`;

                    if (msg.sender === 'ai') {
                        messageWrapper.innerHTML = `
                            <div class="flex items-end gap-2">
                                <div class="chat-bubble chat-bubble-ai">
                                    ${msg.text}
                                </div>
                                <button class="tts-button flex-shrink-0 mb-2 text-gray-400 hover:text-[var(--system-blue)]">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.969 9.969 0 0117 10c0 2.692-.998 5.143-2.639 6.964a1 1 0 01-1.414-1.414A7.97 7.97 0 0015 10c0-2.278-.898-4.344-2.343-5.858a1 1 0 010-1.212z" clip-rule="evenodd" /><path d="M12.293 6.293a1 1 0 011.414 0A4.978 4.978 0 0115 10c0 1.456-.599 2.774-1.581 3.707a1 1 0 01-1.414-1.414A2.98 2.98 0 0013 10c0-.85-.35-1.64-.923-2.207a1 1 0 010-1.5z" /></svg>
                                </button>
                            </div>
                        `;
                    } else {
                        messageWrapper.innerHTML = `
                             <div class="chat-bubble chat-bubble-user">
                                ${msg.text}
                            </div>
                        `;
                    }
                    chatMessagesContainer.appendChild(messageWrapper);
                });
                chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
            }

            // --- State Update & Interaction ---
            messageForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userInput = messageInput.value.trim();
                if (userInput === '') return;

                // 1. Update data array
                messages.push({ sender: 'user', text: userInput });
                
                // 2. Re-render UI
                renderMessages();

                // 3. Clear input
                messageInput.value = '';

                // 4. Simulate AI response
                setTimeout(() => {
                    const aiResponse = "زۆر باشە، تێگەیشتم. لە ئێستادا لەژێر پەرەپێدانم، بەڵام هەوڵ دەدەم باشترین وەڵامت بدەمەوە.";
                    messages.push({ sender: 'ai', text: aiResponse });
                    renderMessages();
                }, 1200);
            });

            // --- Navigation Logic ---
            function navigateTo(viewId, title) {
                if (viewId === currentViewId) return;

                const currentView = document.getElementById(currentViewId);
                const nextView = document.getElementById(viewId);

                if (headerTitle) {
                    headerTitle.textContent = title;
                }

                if (currentView && nextView) {
                    currentView.classList.add('slide-out-left');
                    nextView.classList.remove('hidden');
                    nextView.classList.add('slide-in-right');

                    setTimeout(() => {
                        currentView.classList.add('hidden');
                        currentView.classList.remove('slide-out-left');
                        nextView.classList.remove('slide-in-right');
                    }, 350);
                }
                
                currentViewId = viewId;

                tabButtons.forEach(button => {
                    if (button.dataset.view === viewId) {
                        button.classList.add('active');
                        button.classList.remove('text-[var(--label-secondary)]');
                    } else {
                        button.classList.remove('active');
                        button.classList.add('text-[var(--label-secondary)]');
                    }
                });
            }

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const viewId = button.dataset.view;
                    const title = button.dataset.title;
                    if(viewId && title) {
                        navigateTo(viewId, title);
                    }
                });
            });

            // --- Initial Render ---
            renderMessages();
            // Set initial header title
            headerTitle.textContent = "Ai KurdCPT";
        });
    </script>
</body>
</html>
